<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Recommendations</title>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="stylesheet" type="text/css" href="/static/main.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      h1 {
        margin-left: 40px;
      }
      button {
        margin-left: 40px;
      }
    </style>
  </head>
  <body>
    <div class="w-full min-h-screen flex flex-col items-center justify-center py-8">
      <div><h1>{{msg}}</h1></div>
      <ul class="product-grid">
        {% for p in recommendations %}

        <li>
          <img
            src="{{p['url']}}"
            srcset="{{p['srcset']}}"
            width="{{thumb_size}}"
            height="{{thumb_size}}"
            alt="{{p['public_id'].split('/')[-1].replace('_', ' ')}}"
            title="Matched tags: {{p['tags'] | join(', ')}}"
            decoding="async"
            {% if loop.index > 6 %}loading="lazy"{% else %}fetchpriority="high"{% endif %}
          />
        </li>

        {% endfor %}
      </ul>
          <form method="GET" action="{{ url_for('index')}}" class="flex flex-col items-center">
      <button
        type="submit"
        class="bg-[#0095FF] rounded-full h-[36px] flex items-center justify-center cursor-pointer text-[16px] gap-[4px] px-[28px] py-[8px] no-underline font-bold transition duration-300 text-white"
      >
        Start Over
      </button>
    </form>
    </div>
  </body>
</html>
